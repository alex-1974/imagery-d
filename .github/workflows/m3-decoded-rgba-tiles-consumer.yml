name: M3 decoded RGBA tile background consumer

on:
  push:
    branches: [research/m3-decoded-rgba-tiles-consumer]
  pull_request:
    branches: [research/m3-standalone-image-roi-consumer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-imports:
    name: M3 tile and ROI consumer / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, dmd-2.113.0, ldc-1.41.0, ldc-1.43.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alex-1974/raster-d
          ref: v0.2.0
          path: deps/raster-d
      - name: Provide isolated raster-d path dependency
        run: ln -sfn "$GITHUB_WORKSPACE/deps/raster-d" "$GITHUB_WORKSPACE/../raster-d"
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Record compiler and DUB versions
        run: |
          "$DC" --version
          dub --version
      - name: Debug external DUB consumer + every ROI full-pixel plus RGBA tile/alpha/seam oracle
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_module_import_surface/smoke \
            --compiler="$DC" --config=default --build=debug --force 2>&1 | tee "$RUNNER_TEMP/roi-debug.log"
          grep -q 'M3 ROI consumer PASS: 16 configurations' "$RUNNER_TEMP/roi-debug.log"
          grep -q 'M3 tile consumer PASS: 48 real scenes' "$RUNNER_TEMP/roi-debug.log"
      - name: Release external DUB consumer + every ROI full-pixel plus RGBA tile/alpha/seam oracle
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_module_import_surface/smoke \
            --compiler="$DC" --config=default --build=release --force 2>&1 | tee "$RUNNER_TEMP/roi-release.log"
          grep -q 'M3 ROI consumer PASS: 16 configurations' "$RUNNER_TEMP/roi-release.log"
          grep -q 'M3 tile consumer PASS: 48 real scenes' "$RUNNER_TEMP/roi-release.log"
      - name: M3 DIP1000 tile local RasterLease escape negative
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/m3-tile-negative.log"
          if dub build --root=experiments/m3_module_import_surface/smoke \
              --compiler="$DC" --config=negative-tile-local-lease-escape \
              --build=debug --force >"$LOG" 2>&1; then
            echo "UNSAFE: tile view escaped locally expiring raster owner"
            exit 1
          fi
          grep -Eq 'consumers/tiles.d' "$LOG" || {
            echo "Negative compilation failed in an unrelated module"
            tail -45 "$LOG"
            exit 1
          }
          grep -Eiq 'scope|escape|return|lifetime' "$LOG" || {
            echo "No DIP1000 borrowed owner lifetime diagnostic"
            tail -45 "$LOG"
            exit 1
          }
      - name: Confirm the prototype does not mutate production package surface
        run: |
          test ! -e dub.sdl
          test ! -e source/imagery/package.d
          test ! -e source/imagery/all.d
          ! grep -Eq 'dependency "(color-d|imageio-d)"' \
            experiments/m3_module_import_surface/dub.sdl
