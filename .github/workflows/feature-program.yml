name: Feature program references
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - compiler: dmd-2.111.0
            target: portable
            flags: ''
          - compiler: ldc-1.43.0
            target: portable
            flags: ''
          - compiler: ldc-1.43.0
            target: x86-64-v3
            flags: '--mcpu=x86-64-v3'
    env:
      DFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/feature_program/requirements.txt
      - name: Independent references and parameter/partition checks
        shell: bash
        run: |
          dub build --root=tests/feature_program --compiler="$DC" --build=debug
          python tools/verify-feature-program.py tests/feature_program/feature-program-oracle
          python tools/canny_reference.py tests/feature_program/feature-program-oracle build/canny-reference
          python tools/verify-mosaic.py tests/feature_program/feature-program-oracle
          dub build --root=tests/component_regions --compiler="$DC" --build=debug
          python tools/verify-component-regions.py tests/component_regions/component-regions-oracle
          python tools/verify-region-program.py tests/component_regions/component-regions-oracle
          dub test --config=no-io --compiler="$DC"
      - name: Scoped workers, configured requests and quality weights
        shell: bash
        run: API_PROBE_CONFIG=no-io bash tools/verify-api-probes.sh
      - name: Actual warm Engine computations allocate zero thread-GC bytes
        shell: bash
        run: |
          dub build :bench --compiler="$DC" --build=release
          ./imagery-d_bench 64 2 resources
          python tools/test-performance-targets.py
          python tools/test-measurement-protocol.py
          python tools/test-instruction-counts.py
