name: R-IM-02a independent histogram consumer

on:
  push:
    branches: [research/r-im-02-histogram-consumer]
  pull_request:
    branches: [research/r-im-01-feature-api-matrix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  histogram-consumer:
    name: Histogram contract / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, dmd-2.113.0, ldc-1.41.0, ldc-1.43.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alex-1974/raster-d
          ref: 2f2415851e45001df92ce56dad409f680684ba8d
          path: deps/raster-d
      - name: Provide isolated pinned sibling dependency
        run: ln -sfn "$GITHUB_WORKSPACE/deps/raster-d" "$GITHUB_WORKSPACE/../raster-d"
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Compiler and DUB identity
        run: |
          "$DC" --version
          dub --version
      - name: Debug independent DUB consumer and oracle
        run: |
          set -euo pipefail
          dub run --root=experiments/r_im_02_histogram/smoke \
            --compiler="$DC" --build=debug --force 2>&1 | tee "$RUNNER_TEMP/histogram-debug.log"
          grep -q 'R-IM-02a histogram consumer PASS: 48 cases, 240 complete' "$RUNNER_TEMP/histogram-debug.log"
      - name: Release independent DUB consumer and oracle
        run: |
          set -euo pipefail
          dub run --root=experiments/r_im_02_histogram/smoke \
            --compiler="$DC" --build=release --force 2>&1 | tee "$RUNNER_TEMP/histogram-release.log"
          grep -q 'R-IM-02a histogram consumer PASS: 48 cases, 240 complete' "$RUNNER_TEMP/histogram-release.log"
      - name: Prototype isolation
        run: |
          test ! -e dub.sdl
          test ! -d source/imagery
          ! grep -Eq 'dependency "(color-d|imageio-d)"' experiments/r_im_02_histogram/dub.sdl
