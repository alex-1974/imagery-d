name: M3.2.5 borrow vs snapshot research

on:
  push:
    branches:
      - research/m3-2-borrow-vs-snapshot
    paths:
      - "experiments/m3_2_borrow_snapshot/**"
      - ".github/workflows/m3-2-borrow-snapshot.yml"
  pull_request:
    branches:
      - research/m3-2-dynamic-metadata
    paths:
      - "experiments/m3_2_borrow_snapshot/**"
      - ".github/workflows/m3-2-borrow-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Borrow vs snapshot / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, dmd-2.113.0, ldc-1.41.0, ldc-1.43.0]
    steps:
      - name: Checkout imagery-d research
        uses: actions/checkout@v7

      - name: Checkout released raster-d
        uses: actions/checkout@v7
        with:
          repository: alex-1974/raster-d
          ref: v0.2.0
          path: deps/raster-d

      - name: Link sibling raster-d
        shell: bash
        run: |
          set -euo pipefail
          ln -sfn "$GITHUB_WORKSPACE/deps/raster-d" \
              "$GITHUB_WORKSPACE/../raster-d"
          git -C "$GITHUB_WORKSPACE/deps/raster-d" rev-parse HEAD

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Record compiler versions
        run: |
          "$DC" --version
          dub --version

      - name: Positive and negative semantic gates
        shell: bash
        run: |
          set -euo pipefail
          COMPILERS="$DC" bash experiments/m3_2_borrow_snapshot/tools/run.sh

      - name: Advisory LDC control-plane timings (no performance threshold)
        if: matrix.compiler == 'ldc-1.43.0'
        shell: bash
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_2_borrow_snapshot \
            --compiler="$DC" --config=default --build=release \
            --force -- --benchmark
