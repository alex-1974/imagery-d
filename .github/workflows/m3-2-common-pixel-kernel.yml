name: M3.2.10 common semantic pixel kernel research

on:
  push:
    branches:
      - research/m3-2-common-pixel-kernel
    paths:
      - "experiments/m3_2_validated_roi/**"
      - "experiments/m3_2_semantic_display/source/m3_2_channel_metadata/**"
      - ".github/workflows/m3-2-common-pixel-kernel.yml"
  pull_request:
    branches:
      - research/m3-2-prepared-semantic-map
    paths:
      - "experiments/m3_2_validated_roi/**"
      - "experiments/m3_2_semantic_display/source/m3_2_channel_metadata/**"
      - ".github/workflows/m3-2-common-pixel-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Shared execution / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, dmd-2.113.0, ldc-1.41.0, ldc-1.43.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alex-1974/raster-d
          ref: v0.2.0
          path: deps/raster-d
      - name: Link raster-d read-only baseline
        run: ln -sfn "$GITHUB_WORKSPACE/deps/raster-d" "$GITHUB_WORKSPACE/../raster-d"
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Record versions
        run: |
          "$DC" --version
          dub --version
      - name: Retain M3.2.6 + expected compiler failures
        run: COMPILERS="$DC" bash experiments/m3_2_validated_roi/tools/run.sh
      - name: Prepared correctness and DIP1000 negatives
        run: COMPILERS="$DC" bash experiments/m3_2_validated_roi/tools/run_prepared.sh
      - name: Shared-kernel three-way consumer oracle
        run: |
          dub run --root=experiments/m3_2_validated_roi \
            --compiler="$DC" --config=default --build=release \
            --force -- --prepared-consumer-smoke 2 2 1
      - name: Verify codegen and XPS scripts
        run: |
          bash -n experiments/m3_2_validated_roi/tools/qualify_prepared_xps.sh
          python3 -m py_compile experiments/m3_2_validated_roi/tools/analyze_prepared_xps.py
      - name: LDC common-function codegen audit and tiny evidence smoke
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/m3210-common-kernel" \
            COMPILER="$DC" REPEATS=1 ROUNDS=2 ITERATIONS=2 WARMUPS=0 \
            bash experiments/m3_2_validated_roi/tools/qualify_prepared_xps.sh
          test -s "$RUNNER_TEMP/m3210-common-kernel/prepared-summary.csv"
          test -s "$RUNNER_TEMP/m3210-common-kernel/disassembly.txt.gz"
          python3 experiments/m3_2_validated_roi/tools/audit_common_kernel.py \
            "$RUNNER_TEMP/m3210-common-kernel/disassembly.txt.gz"
