name: M3.2 semantic display research

on:
  push:
    branches:
      - research/m3-2-semantic-display
      - research/m3-2-channel-metadata
    paths:
      - "experiments/m3_2_semantic_display/**"
      - ".github/workflows/m3-2-semantic-display.yml"
  pull_request:
    branches:
      - research-integration
      - research/m3-2-semantic-display
    paths:
      - "experiments/m3_2_semantic_display/**"
      - ".github/workflows/m3-2-semantic-display.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Semantic view / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0
          - dmd-2.113.0
          - ldc-1.43.0

    steps:
      - name: Checkout imagery-d research
        uses: actions/checkout@v7

      - name: Checkout raster-d released boundary
        uses: actions/checkout@v7
        with:
          repository: alex-1974/raster-d
          ref: v0.2.0
          path: deps/raster-d

      - name: Recreate raster-d sibling dependency
        shell: bash
        run: |
          set -euo pipefail
          ln -sfn "$GITHUB_WORKSPACE/deps/raster-d" \
              "$GITHUB_WORKSPACE/../raster-d"
          git -C "$GITHUB_WORKSPACE/deps/raster-d" rev-parse HEAD

      - name: Install D toolchain
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Toolchain versions
        run: |
          "$DC" --version
          dub --version

      - name: Run synthetic and lifetime experiments
        env:
          COMPILERS: ${{ env.DC }}
        run: |
          set -euo pipefail
          COMPILERS="$DC" \
            bash experiments/m3_2_semantic_display/tools/run.sh
