name: M3 Levels candidate consumer gate
on:
  push:
    branches: [develop, feat/m3-levels-owned-result, feat/rgb-luminance-stretch]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    name: Levels candidate / ${{ matrix.compiler }} / ${{ matrix.build }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.113.0, ldc-1.43.0]
        build: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alex-1974/raster-d
          ref: 69fee76d8e2ad14c02ad8d4c6720a89ce46979ea # raster-d v0.5.5
          path: deps/raster-d
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Register pinned raster-d consumer dependency
        run: dub add-local deps/raster-d 0.5.5
      - name: Build and test ordinary imagery-d package
        run: |
          set -euo pipefail
          dub test --compiler="$DC" --build="${{ matrix.build }}" --force
          dub build --compiler="$DC" --build="${{ matrix.build }}" --force
      - name: Execute independent DUB Levels consumer
        run: |
          set -euo pipefail
          dub run --root=tests/consumer --compiler="$DC" --build="${{ matrix.build }}" --force \
            2>&1 | tee "$RUNNER_TEMP/m3-owned-consumer.log"
          grep -q 'M3_LEVELS_PRODUCTION_CONSUMER=PASS' "$RUNNER_TEMP/m3-owned-consumer.log"
          grep -q 'M3_RGB_HISTOGRAM_CONSUMER=PASS' "$RUNNER_TEMP/m3-owned-consumer.log"
          grep -q 'M5_OVERVIEW_SELECTION_CONSUMER=PASS' "$RUNNER_TEMP/m3-owned-consumer.log"
      - name: Real source-archive package via out-of-tree DUB consumer
        run: bash tools/verify-archived-consumer.sh "${{ matrix.build }}"
      - name: Independent 90-digit Decimal numerical oracle
        run: |
          set -euo pipefail
          dub build --root=tests/precision_consumer --compiler="$DC" --build="${{ matrix.build }}" --force
          python3 tools/verify-levels-precision.py tests/precision_consumer/m3-levels-precision
      - name: Isolated API and DIP1000 compile contracts
        run: bash tools/verify-api-probes.sh
      - name: End-to-end image-file consumer and independent byte oracle
        run: |
          set -euo pipefail
          ROOT=tests/ppm_consumer
          dub build --root="$ROOT" --compiler="$DC" --build="${{ matrix.build }}" --force
          test -x "$ROOT/m3-levels-production-ppm"
          python3 - "$ROOT/m3-levels-production-ppm" "$RUNNER_TEMP" <<'PY'
          import math,pathlib,subprocess,sys
          exe=pathlib.Path(sys.argv[1]).resolve()
          root=pathlib.Path(sys.argv[2])
          raw=bytes([10,0,255, 64,128,192, 255,64,0, 0,10,127])
          src=root/"m3-input.ppm"
          src.write_bytes(b"P6\n# image fixture\n2 2\n255\n"+raw)
          one=root/"m3-id.ppm"
          two=root/"m3-gamma.ppm"
          subprocess.run([str(exe),str(src),str(one),"0","1","1","0","1"],check=True)
          assert one.read_bytes()==b"P6\n2 2\n255\n"+raw
          subprocess.run([str(exe),str(src),str(two),"0","1","2","0","1"],check=True)
          want=bytes(min(255,int(math.sqrt(v/255)*255+0.5)) for v in raw)
          assert two.read_bytes()==b"P6\n2 2\n255\n"+want
          failed=root/"m3-bad.ppm"
          p=subprocess.run([str(exe),str(src),str(failed),"0","1","NaN","0","1"],
                            capture_output=True)
          assert p.returncode!=0 and not failed.exists()
          p=subprocess.run([str(exe),str(src),str(one),"0","1","1","0","1"],
                            capture_output=True)
          assert p.returncode!=0 and one.read_bytes()==b"P6\n2 2\n255\n"+raw
          print("M3_LEVELS_PRODUCTION_P6=PASS; identity, gamma, invalid, no overwrite")
          PY
      - name: M4 reproducible RGB scene through existing P6 Levels consumer
        run: |
          python3 tests/corpus/verify_m4_levels.py \
            tests/ppm_consumer/m3-levels-production-ppm "$RUNNER_TEMP"
      - name: M4 RGB histogram ROI and mask byte oracle through the file consumer
        run: |
          python3 tests/corpus/verify_m4_histogram.py \
            tests/ppm_consumer/m3-levels-production-ppm "$RUNNER_TEMP"
      - name: M4 RGB percentile contrast stretch through the P6 file consumer
        run: |
          python3 tests/corpus/verify_m4_stretch.py \
            tests/ppm_consumer/m3-levels-production-ppm "$RUNNER_TEMP"
      - name: M4 RGB equalization through the P6 file consumer
        run: |
          python3 tests/corpus/verify_m4_equalize.py \
            tests/ppm_consumer/m3-levels-production-ppm "$RUNNER_TEMP"
      - name: M4 RGB luminance stretch through independent XYZ-D65-Y oracle
        run: |
          python3 tests/corpus/verify_m4_luminance_stretch.py \
            tests/ppm_consumer/m3-levels-production-ppm "$RUNNER_TEMP"

  docs:
    name: Render candidate Ddoc with DDox
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alex-1974/raster-d
          ref: 69fee76d8e2ad14c02ad8d4c6720a89ce46979ea # raster-d v0.5.5
          path: deps/raster-d
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-2.113.0
      - name: Register pinned raster-d
        run: dub add-local deps/raster-d 0.5.5
      - name: Render candidate API docs
        run: bash tools/build-docs.sh
      - name: Validate consumer source archive boundary
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | tar -tf - > "$RUNNER_TEMP/package-content.txt"
          grep -Fxq 'LICENSE' "$RUNNER_TEMP/package-content.txt"
          grep -Fxq 'dub.sdl' "$RUNNER_TEMP/package-content.txt"
          grep -Fxq 'source/imagery/presentation/levels.d' "$RUNNER_TEMP/package-content.txt"
          grep -Fxq 'source/imagery/presentation/luminance_stretch.d' "$RUNNER_TEMP/package-content.txt"
          if grep -Eq '^(experiments|tests|\.github|docs/research)/' "$RUNNER_TEMP/package-content.txt"; then
            echo 'ERROR: non-consumer research/test material in package archive' >&2
            exit 1
          fi
          echo M3_LEVELS_ARCHIVE=PASS

  performance:
    name: LDC Release / bounded real P6 workload receipt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alex-1974/raster-d
          ref: 69fee76d8e2ad14c02ad8d4c6720a89ce46979ea # raster-d v0.5.5
          path: deps/raster-d
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Register pinned raster-d
        run: |
          dub fetch color-d@0.3.0
          dub fetch mir-algorithm@3.22.4
          dub fetch mir-core@1.7.4
          dub fetch silly@1.1.1
          dub add-local deps/raster-d 0.5.5
      - name: Build ordinary package consumer in Release mode
        run: dub build --root=tests/ppm_consumer --compiler="$DC" --build=release --force
      - name: Build bounded native paired DUB performance consumer
        run: dub build --root=tests/perf_consumer --compiler="$DC" --build=release --force
      - name: Paired native kernel performance and independent sqrt oracle
        run: |
          set -euo pipefail
          CPU="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          echo "M3_LEVELS_PERF_CPU_AFFINITY=$CPU"
          lscpu | grep -E '^(Model name|CPU\(s\)|Architecture):' || true
          governor="/sys/devices/system/cpu/cpu${CPU}/cpufreq/scaling_governor"
          if test -f "$governor"; then echo "M3_LEVELS_PERF_GOVERNOR=$(cat "$governor")"; fi
          taskset -c "$CPU" tests/perf_consumer/m3-levels-paired-perf |
            tee "$RUNNER_TEMP/m3-levels-paired.log"
          grep -q 'M3_LEVELS_PAIRED_PERF=PASS' "$RUNNER_TEMP/m3-levels-paired.log"
          grep -q 'M3_RGB_LUMINANCE_STRETCH_PERF=PASS' "$RUNNER_TEMP/m3-levels-paired.log"
      - name: Compare separate and direct RGB LUT output paths
        run: |
          set -euo pipefail
          CPU="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          taskset -c "$CPU" tests/perf_consumer/m3-levels-paired-perf \
            --fused-rgb-roi | tee "$RUNNER_TEMP/m4-fused-rgb-roi.log"
          grep -q 'M4_FUSED_RGB_ROI=PASS' "$RUNNER_TEMP/m4-fused-rgb-roi.log"
      - name: Measure bounded P6 end-to-end identity workloads
        run: |
          set -euo pipefail
          python3 - tests/ppm_consumer/m3-levels-production-ppm "$RUNNER_TEMP" <<'PY'
          import hashlib,json,pathlib,statistics,subprocess,sys,time
          exe=pathlib.Path(sys.argv[1]).resolve()
          tmp=pathlib.Path(sys.argv[2])
          for n in (512,1024):
              # Deterministic, nonconstant encoded RGB; no generated fixtures in Git.
              pix=bytes((i*29+7)%256 for i in range(n*n*3))
              header=f"P6\n{n} {n}\n255\n".encode()
              inp=tmp/f"m3-perf-{n}.ppm"
              inp.write_bytes(header+pix)
              times=[]
              for run in range(4):
                  out=tmp/f"m3-perf-{n}-run{run}.ppm"
                  start=time.perf_counter()
                  subprocess.run([str(exe),str(inp),str(out),
                                  "0","1","1","0","1"],
                                  check=True,stdout=subprocess.DEVNULL)
                  elapsed=time.perf_counter()-start
                  assert hashlib.sha256(out.read_bytes()).digest()==hashlib.sha256(header+pix).digest()
                  if run: times.append(elapsed)
                  out.unlink()
              median=statistics.median(times)
              print("M3_LEVELS_P6_LDC_RELEASE="+json.dumps({
                  "shape":[n,n],"runs":len(times),"warmups":1,
                  "median_ms":round(median*1000,3),
                  "end_to_end_mpix_s":round(n*n/median/1e6,3),
                  "scope":"whole P6 read, decode/import, Levels, quantize/write",
                  "machine":"GitHub hosted runner; not an absolute baseline"}))
          print("M3_LEVELS_PERF_SMOKE=PASS")
          PY
