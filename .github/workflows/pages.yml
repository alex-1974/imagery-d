name: Publish versioned API documentation to GitHub Pages
on:
  workflow_run:
    workflows: ['Publish imagery-d v0.4.0 from annotated tag']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Exact published latest version tag
        required: true
        default: v0.4.0
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Verify published API assets and preserve versioned references
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build stable and versioned docs from published checksummed assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || 'v0.4.0' }}
        run: |
          python3 tools/build-release-docs-site.py --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" --output build/published-docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/published-docs
  deploy:
    name: Deploy qualified release documentation
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
