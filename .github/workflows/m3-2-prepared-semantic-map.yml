name: M3.2.9 prepared semantic map research

on:
  push:
    branches:
      - research/m3-2-prepared-semantic-map
    paths:
      - "experiments/m3_2_validated_roi/**"
      - ".github/workflows/m3-2-prepared-semantic-map.yml"
  pull_request:
    branches:
      - research/m3-2-consumer-amortization
    paths:
      - "experiments/m3_2_validated_roi/**"
      - ".github/workflows/m3-2-prepared-semantic-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Prepared semantic map / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, dmd-2.113.0, ldc-1.41.0, ldc-1.43.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alex-1974/raster-d
          ref: v0.2.0
          path: deps/raster-d
      - name: Link pinned raster dependency
        run: ln -sfn "$GITHUB_WORKSPACE/deps/raster-d" "$GITHUB_WORKSPACE/../raster-d"
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Compiler context
        run: |
          "$DC" --version
          dub --version
      - name: Retain M3.2.6 positive and negative gates
        run: COMPILERS="$DC" bash experiments/m3_2_validated_roi/tools/run.sh
      - name: M3.2.9 prepared and lifetime tests
        run: COMPILERS="$DC" bash experiments/m3_2_validated_roi/tools/run_prepared.sh

      - name: Prepared three-way mapped-pixel consumer oracle smoke
        run: |
          dub run --root=experiments/m3_2_validated_roi \
            --compiler="$DC" --config=default --build=release \
            --force -- --prepared-consumer-smoke 2 2 1

      - name: Verify prepared XPS scripts
        run: |
          bash -n experiments/m3_2_validated_roi/tools/qualify_prepared_xps.sh
          python3 -m py_compile experiments/m3_2_validated_roi/tools/analyze_prepared_xps.py
      - name: Paired three-path evidence runner smoke (not timing qualification)
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/m329-prepared-evidence" \
            COMPILER="$DC" REPEATS=1 ROUNDS=2 ITERATIONS=2 WARMUPS=0 \
            bash experiments/m3_2_validated_roi/tools/qualify_prepared_xps.sh
          test -s "$RUNNER_TEMP/m329-prepared-evidence/prepared-summary.csv"
          test -s "$RUNNER_TEMP/m329-prepared-evidence/prepared-raw.csv"
          test -s "$RUNNER_TEMP/m329-prepared-evidence/timed-binary.sha256"
