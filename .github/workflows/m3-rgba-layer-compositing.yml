name: M3 decoded RGBA source-over consumer

on:
  push:
    branches: [research/m3-rgba-layer-compositing]
  pull_request:
    branches: [research/m3-decoded-rgba-tiles-consumer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rgba-consumer:
    name: RGBA source-over / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.112.1, dmd-2.113.0, ldc-1.42.0, ldc-1.43.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alex-1974/raster-d
          ref: v0.2.0
          path: deps/raster-d
      - uses: actions/checkout@v4
        with:
          repository: alex-1974/color-d
          ref: v0.2.0
          path: deps/color-d
      - name: Provide pinned sibling path dependencies
        run: |
          ln -sfn "$GITHUB_WORKSPACE/deps/raster-d" "$GITHUB_WORKSPACE/../raster-d"
          ln -sfn "$GITHUB_WORKSPACE/deps/color-d" "$GITHUB_WORKSPACE/../color-d"
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Record D compiler and DUB versions
        run: |
          "$DC" --version
          dub --version
      - name: Verify public same-owner alias boundary (released raster-d)
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/alias_boundary \
            --compiler="$DC" --build=release --force 2>&1 \
            | tee "$RUNNER_TEMP/alias-boundary.log"
          grep -q '^M3-ALIAS-BOUNDARY PASS:' "$RUNNER_TEMP/alias-boundary.log"
          grep -q '^M3-IMAGE-ALIAS-WITNESS PASS:' "$RUNNER_TEMP/alias-boundary.log"
      - name: Debug separate DUB layer consumer and independent all-pixel oracle
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=debug --force 2>&1 \
            | tee "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA composite consumer PASS: 432 scenes, 51840' \
            "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA prepared consumer PASS: 432 byte-exact scenes' \
            "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA owned-packed result PASS: 432 byte-exact scenes' \
            "$RUNNER_TEMP/composite-debug.log"
          grep -q '^M3 FUSED-PM RECHECK PASS:' \
            "$RUNNER_TEMP/composite-debug.log"
          for caseId in 0 1 2 3; do
            grep -q "^M3 PM MASK LATE MUTATION PASS: case=$caseId," \
              "$RUNNER_TEMP/composite-debug.log"
          done
          grep -q 'M3 RGBA reservation/fault PASS:' "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA two-subscriber retention PASS:' "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA independent delivery PASS:' "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA payload-only admission PASS:' "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA multigeneration PASS:' "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA generation cancellation PASS:' "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA multigeneration GC metadata observation:' "$RUNNER_TEMP/composite-debug.log"
      - name: Release separate DUB layer consumer and independent all-pixel oracle
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=release --force 2>&1 \
            | tee "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA composite consumer PASS: 432 scenes, 51840' \
            "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA reservation/fault PASS:' "$RUNNER_TEMP/composite-release.log"
          grep -q '^M3 FUSED-PM RECHECK PASS:' "$RUNNER_TEMP/composite-release.log"
          for caseId in 0 1 2 3; do
            grep -q "^M3 PM MASK LATE MUTATION PASS: case=$caseId," \
              "$RUNNER_TEMP/composite-release.log"
          done
          grep -q 'M3 RGBA two-subscriber retention PASS:' "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA independent delivery PASS:' "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA payload-only admission PASS:' "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA multigeneration PASS:' "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA generation cancellation PASS:' "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA multigeneration GC metadata observation:' "$RUNNER_TEMP/composite-release.log"
      - name: External DUB research-only owned slice boundary (debug and release)
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/owned_slice_smoke
          for build in debug release; do
            log="$RUNNER_TEMP/owned-slice-${build}.log"
            dub run --root="$ROOT" --compiler="$DC" --config=default \
              --build="$build" --force 2>&1 | tee "$log"
            grep -q '^M3 OWNED SLICE EXTERNAL DUB PASS:' "$log"
            test "$(grep -c '^M3 OWNED SLICE CASE PASS:' "$log")" -eq 8
            grep -q '^M3 OWNED SLICE REJECTION PASS:' "$log"
          done
      - name: Inject real native failures into the separate owned-slice library
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/owned_slice_smoke
          cc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -o "$RUNNER_TEMP/libm3_owned_slice_fault.so" \
            experiments/m3_rgba_layer_compositing/alloc_events/m3_fail_pixel_malloc.c
          dub build --root="$ROOT" --compiler="$DC" \
            --config=native-faults --build=release --force
          BIN="$ROOT/m3-rgba-owned-slice-smoke"
          test -x "$BIN"
          LD_PRELOAD="$RUNNER_TEMP/libm3_owned_slice_fault.so" \
            "$BIN" --native-faults 2>&1 \
            | tee "$RUNNER_TEMP/owned-slice-native-faults.log"
          for kind in 1 2 3 4; do
            grep -q "^M3 OWNED SLICE NATIVE FAULT PASS: kind=$kind," \
              "$RUNNER_TEMP/owned-slice-native-faults.log"
          done
          grep -q '^M3 OWNED SLICE NATIVE PREFLIGHT PASS:' \
            "$RUNNER_TEMP/owned-slice-native-faults.log"
          grep -q '^M3 OWNED SLICE NATIVE FAULT MATRIX PASS:' \
            "$RUNNER_TEMP/owned-slice-native-faults.log"
      - name: Benchmark owned-result three-path semantic smoke
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          for pattern in mixed transparent; do
            dub run --root="$ROOT" --compiler="$DC" --build=release \
              -- --owned-bench --width=192 --height=192 --side=16 \
              --rounds=2 --iterations=2 --layout=interleaved \
              "--pattern=$pattern" 2>&1 | tee "$RUNNER_TEMP/owned-bench.log"
            grep -q '^OWNED-BENCH PASS:' "$RUNNER_TEMP/owned-bench.log"
            test "$(grep -Ec "^(mixed|transparent),interleaved,square16,192,192," "$RUNNER_TEMP/owned-bench.log")" -eq 6
          done
      - name: Verify pinned owned XPS snapshot and CSV provenance
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          bash -n tools/research/run_m3_rgba_owned_result_xps.sh
          python3 tools/research/test_summarize_m3_rgba_owned_result_xps.py
          bash tools/research/run_m3_rgba_owned_result_xps.sh --smoke \
            "$RUNNER_TEMP/owned-xps-pinned"
      - name: Validate paired owned preflight benchmark and strict CSV parser
        run: |
          set -euo pipefail
          bash -n tools/research/run_m3_rgba_owned_preflight_xps.sh
          bash -n tools/research/replay_m3_rgba_owned_preflight_xps.sh
          python3 tools/research/summarize_m3_rgba_owned_preflight_xps.py --self-test
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          for meaning in encoded-straight linear-pm; do
            log="$RUNNER_TEMP/preflight-$meaning.log"
            dub run --root="$ROOT" --compiler="$DC" --config=default \
              --build=release --force -- --owned-preflight-bench \
              --width=192 --height=192 --side=16 --rounds=2 \
              --iterations=2 --pattern=mixed --layout=interleaved \
              "--meaning=$meaning" 2>&1 | tee "$log"
            grep -q '^M3 OWNED PREFLIGHT BENCH PASS:' "$log"
            test "$(grep -Ec "^$meaning,mixed,interleaved,square16," "$log")" -eq 6
          done
      - name: Validate staged single-scan owned RGBA performance control
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          for meaning in encoded-straight linear-pm; do
            log="$RUNNER_TEMP/fused-owned-$meaning.log"
            dub run --root="$ROOT" --compiler="$DC" --config=default \
              --build=release --force -- --owned-fused-bench \
              --width=192 --height=192 --side=16 --rounds=2 \
              --iterations=8 --pattern=mixed --layout=interleaved \
              "--meaning=$meaning" 2>&1 | tee "$log"
            grep -q '^M3 FUSED OWNED BENCH PASS:' "$log"
            test "$(grep -Ec "^$meaning,mixed,interleaved,square16," "$log")" -eq 6
            grep -q ',owned_old_order,' "$log"
            grep -q ',owned_early_preflight,' "$log"
            grep -q ',owned_fused_checked,' "$log"
          done
      - name: Compare separately linked owned library against original private whole-result kernels
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          for meaning in encoded-straight linear-pm; do
            for pattern in mixed transparent; do
              log="$RUNNER_TEMP/library-bench-$meaning-$pattern.log"
              dub run --root="$ROOT" --compiler="$DC" --config=default \
                --build=release --force -- --owned-library-bench \
                --width=192 --height=192 --side=16 --rounds=2 \
                --iterations=2 "--pattern=$pattern" --layout=interleaved \
                "--meaning=$meaning" 2>&1 | tee "$log"
              grep -q '^M3 OWNED LIBRARY BENCH PASS:' "$log"
              test "$(grep -Ec "^$meaning,$pattern,interleaved,square16," "$log")" -eq 6
              grep -q ',owned_old_order,' "$log"
              grep -q ',owned_fused_checked,' "$log"
              grep -q ',owned_extracted_library,' "$log"
            done
          done
      - name: Validate fused XPS parser and immutable XPS smoke
        run: |
          set -euo pipefail
          bash -n tools/research/run_m3_rgba_fused_xps.sh
          python3 tools/research/summarize_m3_rgba_fused_xps.py --self-test
      - name: Validate extracted-library XPS runner and three-path parser
        run: |
          set -euo pipefail
          bash -n tools/research/run_m3_rgba_owned_library_xps.sh
          python3 tools/research/summarize_m3_rgba_owned_library_xps.py --self-test

      - name: LDC 1.43 immutable extracted owned-library XPS smoke
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          bash tools/research/run_m3_rgba_owned_library_xps.sh --smoke \
            "$RUNNER_TEMP/owned-library-xps-pinned"
          test -s "$RUNNER_TEMP/owned-library-xps-pinned/LIBRARY_COMPARISON.csv"
          (
            cd "$RUNNER_TEMP/owned-library-xps-pinned"
            sha256sum -c CHECKSUMS.sha256
          )

      - name: Inspect ThinLTO toolchain control and unchanged source archive
        run: |
          set -euo pipefail
          bash -n tools/research/run_m3_rgba_owned_library_thinlto_xps.sh
          python3 -m py_compile tools/research/inspect_m3_owned_lto_codegen.py
          python3 tools/research/summarize_m3_rgba_owned_library_xps.py --self-test

      - name: LDC 1.43 separate library ThinLTO pinned-native control smoke
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          command -v ld.lld
          command -v objdump
          OUT="$RUNNER_TEMP/owned-library-thinlto-xps-pinned"
          bash tools/research/run_m3_rgba_owned_library_thinlto_xps.sh \
            --smoke "$OUT"
          test -s "$OUT/LIBRARY_COMPARISON.csv"
          test -s "$OUT/CODEGEN_CALLS.json"
          grep -q '^optimization_mode=thin-lto
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          bash tools/research/run_m3_rgba_fused_xps.sh --smoke \
            "$RUNNER_TEMP/fused-xps-pinned"
          test -s "$RUNNER_TEMP/fused-xps-pinned/FUSED_COMPARISON.csv"
          (
            cd "$RUNNER_TEMP/fused-xps-pinned"
            sha256sum -c CHECKSUMS.sha256
          )
      - name: LDC 1.43 immutable paired preflight XPS smoke
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          bash tools/research/run_m3_rgba_owned_preflight_xps.sh --smoke \
            "$RUNNER_TEMP/owned-preflight-xps-pinned"
          test -s "$RUNNER_TEMP/owned-preflight-xps-pinned/PREFLIGHT_COMPARISON.csv"
          (
            cd "$RUNNER_TEMP/owned-preflight-xps-pinned"
            sha256sum -c CHECKSUMS.sha256
          )
      - name: Delivery retain/close benchmark semantic smoke (not performance qualification)
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=release --force -- \
            --delivery-bench --rounds=2 --iterations=4096 --warmups=1 2>&1 \
            | tee "$RUNNER_TEMP/delivery-bench.log"
          grep -q '^DELIVERY-METADATA research_cache_control_gc_thread_bytes=' \
            "$RUNNER_TEMP/delivery-bench.log"
          grep -q '^DELIVERY-BENCH PASS:' "$RUNNER_TEMP/delivery-bench.log"
          test "$(grep -c '^m3_delivery,' "$RUNNER_TEMP/delivery-bench.log")" -eq 4
          test "$(grep -c ',raw_raster_lease,' "$RUNNER_TEMP/delivery-bench.log")" -eq 2
          test "$(grep -c ',owned_delivery_handle,' "$RUNNER_TEMP/delivery-bench.log")" -eq 2
          python3 tools/research/summarize_m3_rgba_delivery_xps.py --self-test
          python3 tools/research/summarize_m3_rgba_delivery_xps.py \
            "$RUNNER_TEMP/delivery-bench.log" > "$RUNNER_TEMP/delivery-paired.csv"
          test "$(grep -c '^round,' "$RUNNER_TEMP/delivery-paired.csv")" -eq 2
          grep -q '^median,2,' "$RUNNER_TEMP/delivery-paired.csv"
      - name: Two-subscriber cache-hit and ROI-eviction workflow smoke
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          for side in 16; do
            log="$RUNNER_TEMP/delivery-workflow-${side}.log"
            dub run --root="$ROOT" --compiler="$DC" --config=default \
              --build=release --force -- \
              --delivery-workflow-bench --side="$side" --rounds=2 \
              --hot-iterations=4096 --churn-iterations=2 --warmups=1 \
              2>&1 | tee "$log"
            grep -q '^DELIVERY-WORKFLOW PASS:' "$log"
            test "$(grep -c '^m3_delivery_workflow,' "$log")" -eq 8
            python3 tools/research/summarize_m3_rgba_delivery_workflow_xps.py \
              "$log" > "$RUNNER_TEMP/delivery-workflow-paired.csv"
            grep -q '^median,16,hot,2,' "$RUNNER_TEMP/delivery-workflow-paired.csv"
            grep -q '^median,16,churn,2,' "$RUNNER_TEMP/delivery-workflow-paired.csv"
          done
          python3 tools/research/summarize_m3_rgba_delivery_workflow_xps.py --self-test
      - name: Large-ROI workflow smoke (LDC 1.43)
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=release --force -- \
            --delivery-workflow-bench --side=64 --rounds=2 \
            --hot-iterations=4096 --churn-iterations=2 --warmups=1 \
            > "$RUNNER_TEMP/delivery-workflow64.log" 2>&1
          grep -q '^DELIVERY-WORKFLOW PASS:' "$RUNNER_TEMP/delivery-workflow64.log"
          python3 tools/research/summarize_m3_rgba_delivery_workflow_xps.py \
            "$RUNNER_TEMP/delivery-workflow64.log" > "$RUNNER_TEMP/delivery-workflow64.csv"
          grep -q '^median,64,churn,2,' "$RUNNER_TEMP/delivery-workflow64.csv"
      - name: Deterministic mixed cache workload and strict paired summary
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          for pair in '25 1' '75 2'; do
            read -r hit subs <<< "$pair"
            log="$RUNNER_TEMP/mixed-${hit}-${subs}.log"
            dub run --root="$ROOT" --compiler="$DC" --config=default \
              --build=release --force -- \
              --delivery-mixed-bench --side=16 --rounds=2 \
              --requests=100 --warmups=0 "--hit=$hit" \
              "--subscribers=$subs" >"$log" 2>&1
            grep -q '^DELIVERY-MIXED PASS:' "$log" || {
              tail -75 "$log"
              exit 1
            }
            test "$(grep -c '^m3_delivery_mixed,' "$log")" -eq 4
            python3 tools/research/summarize_m3_rgba_delivery_mixed_xps.py \
              "$log" > "$RUNNER_TEMP/mixed-paired.csv"
            grep -q "^median,16,${hit},${subs},2," \
              "$RUNNER_TEMP/mixed-paired.csv"
          done
          python3 tools/research/summarize_m3_rgba_delivery_mixed_xps.py --self-test
      - name: Four-subscriber 95-percent-hit mixed cache consumer
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=release --force -- \
            --delivery-mixed-bench --side=64 --rounds=2 --requests=100 \
            --warmups=0 --hit=95 --subscribers=4 \
            > "$RUNNER_TEMP/mixed-95-4.log" 2>&1
          grep -q '^DELIVERY-MIXED PASS:' "$RUNNER_TEMP/mixed-95-4.log" || {
            tail -75 "$RUNNER_TEMP/mixed-95-4.log"
            exit 1
          }
          python3 tools/research/summarize_m3_rgba_delivery_mixed_xps.py \
            "$RUNNER_TEMP/mixed-95-4.log" > "$RUNNER_TEMP/mixed-95-4.csv"
          grep -q '^median,64,95,4,2,' "$RUNNER_TEMP/mixed-95-4.csv"
      - name: Linux/glibc generation residency observation and validator
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          log="$RUNNER_TEMP/generation-memory16.log"
          dub run --root="$ROOT" --compiler="$DC" --config=default \
            --build=release --force -- --generation-memory --side=16 \
            > "$log" 2>&1 || {
              tail -100 "$log"
              exit 1
            }
          grep -q '^M3 GENERATION MEMORY PASS:' "$log"
          if ! python3 tools/research/summarize_m3_rgba_generation_memory_xps.py \
              "$log" > "$RUNNER_TEMP/generation-memory16.csv"; then
            echo "MEMORY TRACE (for root cause, not an admission bound):" >&2
            grep -E '^(experiment,|m3_generation_memory,|M3 GENERATION MEMORY PASS:)' "$log" >&2
            exit 1
          fi
          grep -q '^16,' "$RUNNER_TEMP/generation-memory16.csv"
          python3 tools/research/summarize_m3_rgba_generation_memory_xps.py --self-test
      - name: Larger native residency observation under LDC 1.43
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/generation-memory256.log"
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=release --force -- \
            --generation-memory --side=256 > "$log" 2>&1 || {
              tail -100 "$log"
              exit 1
            }
          if ! python3 tools/research/summarize_m3_rgba_generation_memory_xps.py \
              "$log" > "$RUNNER_TEMP/generation-memory256.csv"; then
            echo "MEMORY TRACE (for root cause, not an admission bound):" >&2
            grep -E '^(experiment,|m3_generation_memory,|M3 GENERATION MEMORY PASS:)' "$log" >&2
            exit 1
          fi
          grep -q '^256,' "$RUNNER_TEMP/generation-memory256.csv"
          # No recompile per repetition: probe process-to-process stability
          # of VmHWM and current-thread GC statistics. Preserve raw rows
          # on ANY anomaly rather than silently weakening the validator.
          BIN=experiments/m3_rgba_layer_compositing/smoke/m3-rgba-layer-compositing-consumer
          test -x "$BIN"
          for repeat in 1 2 3; do
            log="$RUNNER_TEMP/generation-memory256-repeat-${repeat}.log"
            "$BIN" --generation-memory --side=256 > "$log" 2>&1 || {
              tail -100 "$log"
              exit 1
            }
            if ! python3 tools/research/summarize_m3_rgba_generation_memory_xps.py \
                "$log" > "$RUNNER_TEMP/generation-memory256-repeat-${repeat}.csv"; then
              echo "PROCESS-REPEAT MEMORY TRACE:" >&2
              grep -E '^(experiment,|m3_generation_memory,|M3 GENERATION MEMORY PASS:)' "$log" >&2
              exit 1
            fi
          done
      - name: Validate independent generation subscriber memory replay
        run: |
          set -euo pipefail
          python3 tools/research/summarize_m3_rgba_generation_subscriber_memory_xps.py --self-test
          bash -n tools/research/run_m3_rgba_generation_subscriber_memory_xps.sh
      - name: LDC 1.43 real three-generation one-vs-four subscriber memory smoke
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          BIN="$ROOT/m3-rgba-layer-compositing-consumer"
          test -x "$BIN"
          for side in 16 256; do
            for subscribers in 1 4; do
              key="subscriber-memory-${side}-${subscribers}"
              "$BIN" --generation-subscriber-memory \
                "--side=$side" "--subscribers=$subscribers" \
                >"$RUNNER_TEMP/$key.txt" 2>"$RUNNER_TEMP/$key.err" || {
                  cat "$RUNNER_TEMP/$key.err" >&2
                  tail -50 "$RUNNER_TEMP/$key.txt" >&2
                  exit 1
                }
              test ! -s "$RUNNER_TEMP/$key.err"
              python3 tools/research/summarize_m3_rgba_generation_subscriber_memory_xps.py \
                "$RUNNER_TEMP/$key.txt" >"$RUNNER_TEMP/$key.csv"
              test "$(wc -l <"$RUNNER_TEMP/$key.csv")" -eq 12
            done
          done
      - name: Validate strict native allocation event stream protocol
        run: |
          set -euo pipefail
          python3 tools/research/summarize_m3_rgba_native_alloc_events.py --self-test
          bash -n tools/research/run_m3_rgba_native_alloc_events_xps.sh
          cc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -o "$RUNNER_TEMP/libm3_alloc_events.so" \
            experiments/m3_rgba_layer_compositing/alloc_events/m3_alloc_events.c
      - name: LDC 1.43 native allocation event trace for actual raster generations
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          dub build --root="$ROOT" --compiler="$DC" \
            --config=native-allocation-events --build=release --force
