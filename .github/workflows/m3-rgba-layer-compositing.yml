name: M3 decoded RGBA source-over consumer

on:
  push:
    branches: [research/m3-rgba-layer-compositing]
  pull_request:
    branches: [research/m3-decoded-rgba-tiles-consumer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rgba-consumer:
    name: RGBA source-over / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.112.1, dmd-2.113.0, ldc-1.42.0, ldc-1.43.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alex-1974/raster-d
          ref: v0.2.0
          path: deps/raster-d
      - uses: actions/checkout@v4
        with:
          repository: alex-1974/color-d
          ref: v0.2.0
          path: deps/color-d
      - name: Provide pinned sibling path dependencies
        run: |
          ln -sfn "$GITHUB_WORKSPACE/deps/raster-d" "$GITHUB_WORKSPACE/../raster-d"
          ln -sfn "$GITHUB_WORKSPACE/deps/color-d" "$GITHUB_WORKSPACE/../color-d"
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Record D compiler and DUB versions
        run: |
          "$DC" --version
          dub --version
      - name: Verify public same-owner alias boundary (released raster-d)
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/alias_boundary \
            --compiler="$DC" --build=release --force 2>&1 \
            | tee "$RUNNER_TEMP/alias-boundary.log"
          grep -q '^M3-ALIAS-BOUNDARY PASS:' "$RUNNER_TEMP/alias-boundary.log"
      - name: Debug separate DUB layer consumer and independent all-pixel oracle
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=debug --force 2>&1 \
            | tee "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA composite consumer PASS: 432 scenes, 51840' \
            "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA prepared consumer PASS: 432 byte-exact scenes' \
            "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA owned-packed result PASS: 432 byte-exact scenes' \
            "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA reservation/fault PASS:' "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA two-subscriber retention PASS:' "$RUNNER_TEMP/composite-debug.log"
          grep -q 'M3 RGBA independent delivery PASS:' "$RUNNER_TEMP/composite-debug.log"
      - name: Release separate DUB layer consumer and independent all-pixel oracle
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=release --force 2>&1 \
            | tee "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA composite consumer PASS: 432 scenes, 51840' \
            "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA reservation/fault PASS:' "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA two-subscriber retention PASS:' "$RUNNER_TEMP/composite-release.log"
          grep -q 'M3 RGBA independent delivery PASS:' "$RUNNER_TEMP/composite-release.log"
      - name: Benchmark owned-result three-path semantic smoke
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          for pattern in mixed transparent; do
            dub run --root="$ROOT" --compiler="$DC" --build=release \
              -- --owned-bench --width=192 --height=192 --side=16 \
              --rounds=2 --iterations=2 --layout=interleaved \
              "--pattern=$pattern" 2>&1 | tee "$RUNNER_TEMP/owned-bench.log"
            grep -q '^OWNED-BENCH PASS:' "$RUNNER_TEMP/owned-bench.log"
            test "$(grep -Ec "^(mixed|transparent),interleaved,square16,192,192," "$RUNNER_TEMP/owned-bench.log")" -eq 6
          done
      - name: Verify pinned owned XPS snapshot and CSV provenance
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          bash -n tools/research/run_m3_rgba_owned_result_xps.sh
          python3 tools/research/test_summarize_m3_rgba_owned_result_xps.py
          bash tools/research/run_m3_rgba_owned_result_xps.sh --smoke \
            "$RUNNER_TEMP/owned-xps-pinned"
      - name: Delivery retain/close benchmark semantic smoke (not performance qualification)
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=release --force -- \
            --delivery-bench --rounds=2 --iterations=4096 --warmups=1 2>&1 \
            | tee "$RUNNER_TEMP/delivery-bench.log"
          grep -q '^DELIVERY-METADATA research_cache_control_gc_thread_bytes=' \
            "$RUNNER_TEMP/delivery-bench.log"
          grep -q '^DELIVERY-BENCH PASS:' "$RUNNER_TEMP/delivery-bench.log"
          test "$(grep -c '^m3_delivery,' "$RUNNER_TEMP/delivery-bench.log")" -eq 4
          test "$(grep -c ',raw_raster_lease,' "$RUNNER_TEMP/delivery-bench.log")" -eq 2
          test "$(grep -c ',owned_delivery_handle,' "$RUNNER_TEMP/delivery-bench.log")" -eq 2
          python3 tools/research/summarize_m3_rgba_delivery_xps.py --self-test
          python3 tools/research/summarize_m3_rgba_delivery_xps.py \
            "$RUNNER_TEMP/delivery-bench.log" > "$RUNNER_TEMP/delivery-paired.csv"
          test "$(grep -c '^round,' "$RUNNER_TEMP/delivery-paired.csv")" -eq 2
          grep -q '^median,2,' "$RUNNER_TEMP/delivery-paired.csv"
      - name: Two-subscriber cache-hit and ROI-eviction workflow smoke
        run: |
          set -euo pipefail
          ROOT=experiments/m3_rgba_layer_compositing/smoke
          for side in 16; do
            log="$RUNNER_TEMP/delivery-workflow-${side}.log"
            dub run --root="$ROOT" --compiler="$DC" --config=default \
              --build=release --force -- \
              --delivery-workflow-bench --side="$side" --rounds=2 \
              --hot-iterations=4096 --churn-iterations=2 --warmups=1 \
              2>&1 | tee "$log"
            grep -q '^DELIVERY-WORKFLOW PASS:' "$log"
            test "$(grep -c '^m3_delivery_workflow,' "$log")" -eq 8
            python3 tools/research/summarize_m3_rgba_delivery_workflow_xps.py \
              "$log" > "$RUNNER_TEMP/delivery-workflow-paired.csv"
            grep -q '^median,16,hot,2,' "$RUNNER_TEMP/delivery-workflow-paired.csv"
            grep -q '^median,16,churn,2,' "$RUNNER_TEMP/delivery-workflow-paired.csv"
          done
          python3 tools/research/summarize_m3_rgba_delivery_workflow_xps.py --self-test
      - name: Large-ROI workflow smoke (LDC 1.43)
        if: matrix.compiler == 'ldc-1.43.0'
        run: |
          set -euo pipefail
          dub run --root=experiments/m3_rgba_layer_compositing/smoke \
            --compiler="$DC" --config=default --build=release --force -- \
            --delivery-workflow-bench --side=64 --rounds=2 \
            --hot-iterations=4096 --churn-iterations=2 --warmups=1 \
            > "$RUNNER_TEMP/delivery-workflow64.log" 2>&1
          grep -q '^DELIVERY-WORKFLOW PASS:' "$RUNNER_TEMP/delivery-workflow64.log"
          python3 tools/research/summarize_m3_rgba_delivery_workflow_xps.py \
            "$RUNNER_TEMP/delivery-workflow64.log" > "$RUNNER_TEMP/delivery-workflow64.csv"
          grep -q '^median,64,churn,2,' "$RUNNER_TEMP/delivery-workflow64.csv"
      - name: Validate pinned XPS delivery evidence runner syntax
        run: |
          set -euo pipefail
          bash -n tools/research/run_m3_rgba_delivery_xps.sh
      - name: Reject forged constructor and mutation of prepared context
        shell: bash
        run: |
          set -euo pipefail
          for configuration in negative-prepared-constructor-forge negative-prepared-private-field-mutation; do
            log="$RUNNER_TEMP/${configuration}.log"
            if dub build --root=experiments/m3_rgba_layer_compositing/smoke \
                --compiler="$DC" "--config=$configuration" \
                --build=debug --force > "$log" 2>&1; then
              echo "UNSAFE: private prepared context capability was forged/mutated" >&2
              exit 1
            fi
            grep -q 'app.d' "$log" || {
              echo "Negative compilation failed outside intended consumer source" >&2
              tail -55 "$log"
              exit 1
            }
            grep -q 'ResearchPreparedRgbaContext\|opacity' "$log" || {
              echo "Missing target constructor/private member diagnostics" >&2
              tail -55 "$log"
              exit 1
            }
          done
      - name: Reject escaped local RasterLease using DIP1000
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/composite-negative.log"
          if dub build --root=experiments/m3_rgba_layer_compositing/smoke \
              --compiler="$DC" --config=negative-local-lease-escape \
              --build=debug --force >"$log" 2>&1; then
            echo "UNSAFE: composite layer escaped local RasterLease"
            exit 1
          fi
          grep -q 'app.d' "$log" || {
            echo "Unexpected negative compilation failure location"
            tail -55 "$log"
            exit 1
          }
          grep -Eiq 'scope|escape|return|lifetime' "$log" || {
            echo "Missing owner-lifetime diagnostic"
            tail -55 "$log"
            exit 1
          }
      - name: Reject implicit delivery copy and raw retained lease escape
        run: |
          set -euo pipefail
          for config in negative-delivery-raw-lease-escape negative-delivery-implicit-copy; do
            log="$RUNNER_TEMP/${config}.log"
            if dub build --root=experiments/m3_rgba_layer_compositing/smoke \
                --compiler="$DC" "--config=$config" \
                --build=debug --force >"$log" 2>&1; then
              echo "UNSAFE: delivery ownership escape or copy accepted" >&2
              exit 1
            fi
            grep -q 'app.d' "$log" || {
              echo "Negative failure outside app.d" >&2
              tail -55 "$log"
              exit 1
            }
            grep -Eiq 'backing_|private|OwnedDeliveryHandle|disable|copy|postblit' "$log" || {
              echo "Missing targeted delivery-ownership compiler diagnostic" >&2
              tail -55 "$log"
              exit 1
            }
          done
      - name: Keep production API unadmitted
        run: |
          test ! -e dub.sdl
          test ! -e source/imagery/package.d
          test ! -e source/imagery/all.d
          ! grep -Eq 'dependency "(color-d|imageio-d)"' \
            experiments/m3_module_import_surface/dub.sdl
